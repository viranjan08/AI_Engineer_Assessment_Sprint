version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=grok
    volumes:
      - ./support_tickets.csv:/app/support_tickets.csv
      - ./tickets.db:/app/backend/tickets.db

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
